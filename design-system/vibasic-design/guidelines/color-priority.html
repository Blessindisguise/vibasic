<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:0}.sw{flex:1;height:64px}.lbl{font:var(--type-helper);color:var(--text-secondary);margin-top:6px}.code{font:500 11px/14px var(--font-sans);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px"><div style="display:flex;flex-direction:column;gap:8px"><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px 0 12px;font:600 12px/16px var(--font-sans);color:var(--priority-urgent-fg);background:var(--priority-urgent-bg);border:1px solid var(--priority-urgent-border);clip-path:polygon(var(--chamfer) 0,100% 0,100% 100%,0 100%,0 var(--chamfer));width:max-content">Khẩn cấp</span><span class="lbl" style="margin:0">Tồn kho ≤ tồn an toàn hoặc hết trước khi hàng về</span><span class="code">--priority-urgent-*</span></div><div style="display:flex;flex-direction:column;gap:8px"><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px 0 12px;font:600 12px/16px var(--font-sans);color:var(--priority-order-fg);background:var(--priority-order-bg);border:1px solid var(--priority-order-border);clip-path:polygon(var(--chamfer) 0,100% 0,100% 100%,0 100%,0 var(--chamfer));width:max-content">Cần đặt</span><span class="lbl" style="margin:0">Tồn kho ≤ ROP — đặt trong tuần</span><span class="code">--priority-order-*</span></div><div style="display:flex;flex-direction:column;gap:8px"><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px 0 12px;font:600 12px/16px var(--font-sans);color:var(--priority-watch-fg);background:var(--priority-watch-bg);border:1px solid var(--priority-watch-border);clip-path:polygon(var(--chamfer) 0,100% 0,100% 100%,0 100%,0 var(--chamfer));width:max-content">Theo dõi</span><span class="lbl" style="margin:0">Gần ROP — chưa cần đặt</span><span class="code">--priority-watch-*</span></div></div></body></html>
